<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container (Full Bleed for Maskable Safe Zone) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring within 80% safe zone -->
  <circle cx="256" cy="256" r="215" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none"/>

  <!-- Main Clipboard/Document Graphic (Inside 80% Safe Area: 51px to 461px) -->
  <g filter="url(#dropShadow)">
    <!-- Sheet background -->
    <rect x="120" y="96" width="272" height="340" rx="20" fill="#FFFFFF"/>
    
    <!-- Header banner inside sheet -->
    <rect x="120" y="96" width="272" height="52" rx="20" fill="#E2E8F0"/>
    <rect x="120" y="128" width="272" height="20" fill="#E2E8F0"/>
    
    <!-- Top Clip Holder -->
    <rect x="196" y="74" width="120" height="42" rx="10" fill="url(#goldGrad)"/>
    <circle cx="256" cy="95" r="8" fill="#FFFFFF"/>

    <!-- Document checklist lines -->
    <rect x="156" y="180" width="32" height="32" rx="8" fill="#10B981"/>
    <!-- Checkmark 1 -->
    <path d="M164 196 L170 202 L180 190" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="204" y="190" width="150" height="12" rx="6" fill="#64748B"/>

    <rect x="156" y="234" width="32" height="32" rx="8" fill="#10B981"/>
    <!-- Checkmark 2 -->
    <path d="M164 250 L170 256 L180 244" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="204" y="244" width="130" height="12" rx="6" fill="#64748B"/>

    <rect x="156" y="288" width="32" height="32" rx="8" fill="#10B981"/>
    <!-- Checkmark 3 -->
    <path d="M164 304 L170 310 L180 298" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="204" y="298" width="140" height="12" rx="6" fill="#64748B"/>

    <!-- Bottom Stamp / Badge -->
    <rect x="156" y="348" width="200" height="44" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="256" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="1">AL-GHOZALI</text>
  </g>
</svg>
